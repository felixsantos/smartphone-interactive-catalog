<header class="navbar-header">
  <div class="navbar-container">
    <!-- Brand Logo -->
    <a routerLink="/catalogo" class="brand-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-name">AURA<span class="brand-sub">MOBILE</span></span>
    </a>

    <!-- Active Device Name Sub-header if viewing Specs -->
    @if (currentDeviceName) {
      <div class="device-active-badge">
        <span class="device-dot"></span>
        <span class="device-name">{{ currentDeviceName }}</span>
        @if (currentDevicePrice) {
          <span class="device-price">{{ currentDevicePrice }}</span>
        }
      </div>
    }

    <!-- Navigation Links -->
    <nav class="nav-links">
      <a routerLink="/catalogo" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Catálogo</span>
      </a>

      <a routerLink="/visualizador/apex-ultra-16-pro" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Visualizador Hardware</span>
      </a>

      <a routerLink="/comparador" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 3l4 4-4 4"/>
          <path d="M20 7H4"/>
          <path d="M8 21l-4-4 4-4"/>
          <path d="M4 17h16"/>
        </svg>
        <span>Comparador 3D ⚔️</span>
      </a>

      <a routerLink="/admin" routerLinkActive="active" class="nav-item admin-nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>Painel CMS</span>
      </a>
    </nav>
  </div>
</header>
